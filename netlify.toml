# Сборка лендинга AvenirOS на Netlify.
#
# Это приложение Next.js 16 (App Router) с языковыми маршрутами и живым
# перенаправлением на корне, поэтому статическим экспортом оно быть не может:
# нужен рантайм Next, который Netlify подключает плагином ниже.
#
# Сборка идёт webpack'ом, а не Turbopack: Turbopack молча пропускает страницу
# без корневого макета, и такую ошибку хочется увидеть на сборке, а не в
# продакшене.
#
# Node закреплён на 22 — на нём проект собирают локально; значение по умолчанию
# у Netlify уже менялось, и тихий скачок версии лендингу ни к чему.

[build]
  command = "npx next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Знак в шапке и подвале лежит в public/ и запрашивается по адресу, а не через
# импорт, поэтому хеша в имени у него нет и Netlify отдал бы ему час жизни.
# Меняется он только вместе с новой сборкой.
[[headers]]
  for = "/logo-light.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
